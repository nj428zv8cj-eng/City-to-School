<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" fill="none" role="img" aria-label="UNICEF Child Friendly Cities Initiative Logo">
  <!-- Official UNICEF Cyan Background -->
  <rect width="760" height="210" rx="14" fill="#1CABE2"/>

  <!-- CFCI Symbol -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Horizon Arch -->
    <path d="M 68 158 A 78 78 0 0 1 242 158" stroke-width="4.5"/>

    <!-- Left Tree -->
    <line x1="68" y1="158" x2="68" y2="148" stroke-width="4"/>
    <path d="M 60 148 C 56 145 56 138 61 135 C 62 130 68 128 73 131 C 77 127 84 129 86 134 C 91 136 91 143 87 147 C 84 150 78 150 75 148" stroke-width="3.5" fill="#1CABE2"/>

    <!-- Left Skyline & Arrow -->
    <path d="M 88 152 L 88 122 L 100 110 L 108 118 L 108 128 L 118 128 L 118 108 L 128 108 L 128 94 L 140 94 L 140 110" stroke-width="4"/>
    <path d="M 94 116 L 100 110 L 100 120" stroke-width="4"/>

    <!-- Joyful Child figure on apex -->
    <circle cx="160" cy="50" r="8.5" stroke-width="4.2" fill="#1CABE2"/>
    <path d="M 146 66 L 160 84 L 174 66" stroke-width="4.5"/>
    <line x1="160" y1="84" x2="160" y2="104" stroke-width="4.5"/>
    <path d="M 152 120 L 160 104 L 168 120" stroke-width="4.5"/>

    <!-- Bicycle on the right slope -->
    <circle cx="196" cy="98" r="6.5" stroke-width="3.8"/>
    <circle cx="218" cy="110" r="6.5" stroke-width="3.8"/>
    <path d="M 196 98 L 206 98 L 218 110 M 206 98 L 204 88 M 198 88 L 208 88 M 206 98 L 214 92 L 218 110 M 211 92 L 217 92" stroke-width="3.5"/>

    <!-- Cloud above Bicycle -->
    <path d="M 226 70 C 224 65 228 60 234 60 C 238 56 246 56 250 61 C 255 60 260 64 259 69 C 263 73 261 78 256 79 L 230 79 C 224 79 223 74 226 70 Z" stroke-width="3.5" fill="#1CABE2"/>

    <!-- Right Skyline -->
    <path d="M 228 124 L 236 124 L 236 136 L 244 136 L 244 148" stroke-width="4"/>

    <!-- Right Tree -->
    <line x1="244" y1="158" x2="244" y2="148" stroke-width="4"/>
    <path d="M 236 148 C 232 145 233 138 238 135 C 240 130 246 128 251 131 C 255 127 261 130 263 135 C 267 137 266 144 262 148 Z" stroke-width="3.5" fill="#1CABE2"/>
  </g>

  <!-- Middle Text: Child Friendly Cities Initiative -->
  <g fill="#FFFFFF" font-family="'Century Gothic', 'Tw Cen MT', 'Avenir Next', 'Avenir', 'Segoe UI', -apple-system, sans-serif" font-weight="600" letter-spacing="-0.02em">
    <text x="290" y="70" font-size="29">Child</text>
    <text x="290" y="103" font-size="29">Friendly</text>
    <text x="290" y="136" font-size="29">Cities</text>
    <text x="290" y="169" font-size="29">Initiative</text>
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="432" y1="36" x2="432" y2="174" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Section: UNICEF & for every child -->
  <g fill="#FFFFFF">
    <!-- unicef Wordmark -->
    <text x="460" y="98" font-family="'Frutiger', 'Univers', 'Helvetica Neue', 'Arial', -apple-system, sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5px">unicef</text>

    <!-- UNICEF Emblem (Mother & Child with Laurel Wreath Globe) -->
    <g transform="translate(644, 76) scale(1.02)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="26" stroke-width="2.2" fill="none"/>
      <ellipse cx="0" cy="0" rx="15" ry="26" stroke-width="1.6" fill="none"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" stroke-width="1.4" fill="none"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke-width="1.6"/>
      <line x1="-23" y1="-13" x2="23" y2="-13" stroke-width="1.2"/>
      <line x1="-23" y1="13" x2="23" y2="13" stroke-width="1.2"/>
      
      <!-- Mother and Child Silhouette in Center -->
      <circle cx="-3" cy="-5" r="3.8" fill="#FFFFFF" stroke="none"/>
      <path d="M -10 12 C -10 4, 3 4, 3 12 Z" fill="#FFFFFF" stroke="none"/>
      <circle cx="5" cy="1" r="2.8" fill="#FFFFFF" stroke="none"/>
      <path d="M 3 12 C 3 7, 10 7, 10 12 Z" fill="#FFFFFF" stroke="none"/>

      <!-- Olive Wreath Laurel Branches -->
      <path d="M -30 17 C -35 0, -29 -17, -18 -26" stroke-width="2.2" fill="none"/>
      <ellipse cx="-32" cy="9" rx="3.8" ry="1.9" transform="rotate(-30 -32 9)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="-34" cy="-1" rx="3.8" ry="1.9" transform="rotate(-15 -34 -1)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="-32" cy="-10" rx="3.8" ry="1.9" transform="rotate(10 -32 -10)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="-26" cy="-19" rx="3.8" ry="1.9" transform="rotate(35 -26 -19)" fill="#FFFFFF" stroke="none"/>

      <path d="M 30 17 C 35 0, 29 -17, 18 -26" stroke-width="2.2" fill="none"/>
      <ellipse cx="32" cy="9" rx="3.8" ry="1.9" transform="rotate(30 32 9)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="34" cy="-1" rx="3.8" ry="1.9" transform="rotate(15 34 -1)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="32" cy="-10" rx="3.8" ry="1.9" transform="rotate(-10 32 -10)" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="26" cy="-19" rx="3.8" ry="1.9" transform="rotate(-35 26 -19)" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Horizontal Divider -->
    <line x1="460" y1="116" x2="688" y2="116" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- for every child Subtext -->
    <text x="460" y="156" font-family="'Century Gothic', 'Tw Cen MT', 'Avenir Next', 'Avenir', 'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="28" letter-spacing="-0.01em">for every child</text>
  </g>
</svg>
